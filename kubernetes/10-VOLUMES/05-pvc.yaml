# ─────────────────────────────────────────────────────────────────────────────
# VOLUME TYPE 5: PersistentVolumeClaim (standalone)
#
# WHAT IS IT?
#   A PVC is a request for durable storage. On EKS with the EBS CSI driver,
#   creating a PVC automatically provisions an EBS volume in AWS.
#   The PVC exists independently of any pod — it is NOT deleted when the pod
#   is deleted. This is the key difference from emptyDir and hostPath.
#
#   PVC lifecycle:
#     kubectl apply PVC  →  EBS volume created in AWS  →  Status: Pending
#     Pod mounts PVC     →  EBS attached to node        →  Status: Bound
#     Pod deleted        →  EBS detached, PVC remains   →  Status: Released
#     New pod mounts PVC →  EBS reattached              →  Status: Bound
#
# USEFUL COMMANDS:
#   kubectl apply -f 05-pvc.yaml -n color-app
#   kubectl get pvc -n color-app
#   kubectl describe pvc color-app-logs-pvc -n color-app
#   # STATUS: Pending → Bound (once a pod mounts it)
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: color-app-logs-pvc
  namespace: color-app
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: gp2
  resources:
    requests:
      storage: 1Gi
