# ─────────────────────────────────────────────────────────────────────────────
# PVC AS A VOLUME (persistent storage)
#   A PersistentVolumeClaim (PVC) requests durable storage from the cluster.
#   Data written to the mounted path survives Pod restarts and rescheduling —
#   unlike emptyDir which is wiped when the Pod dies.
#
# USE CASE:
#   color-app writes logs to /var/log/color-app. Without a PVC those logs
#   disappear when the Pod restarts. Mounting a PVC there persists them.
#
# DEMO — VOLUME SURVIVES POD DELETION:
#
#   STEP 1 — Apply and wait for PVC to bind
#   kubectl apply -f pvc-volume.yaml -n color-app
#   kubectl get pvc -n color-app                          # wait for: Bound
#   kubectl get pod color-app-pvc-vol -n color-app        # wait for: Running
#
#   STEP 2 — Write data into the volume
#   kubectl exec -it color-app-pvc-vol -n color-app -- sh
#   echo "this data will survive pod deletion" > /var/log/color-app/test.txt
#   cat /var/log/color-app/test.txt
#   exit
#
#   STEP 3 — Delete the pod (simulates crash or eviction)
#   kubectl delete pod color-app-pvc-vol -n color-app
#   kubectl get pvc -n color-app                          # PVC still exists!
#
#   STEP 4 — Recreate the pod and verify data is still there
#   kubectl apply -f pvc-volume.yaml -n color-app
#   kubectl exec -it color-app-pvc-vol -n color-app -- cat /var/log/color-app/test.txt
#   # Output: this data will survive pod deletion  ✅
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: color-app-logs-pvc
  namespace: color-app
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: gp2
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: color-app-pvc-vol
  namespace: color-app
  labels:
    app: color-app
spec:
  containers:
  - name: color-app
    image: chafah/color-app:latest
    ports:
    - containerPort: 8080
    volumeMounts:
    - name: logs-storage
      mountPath: /var/log/color-app
  volumes:
  - name: logs-storage
    persistentVolumeClaim:
      claimName: color-app-logs-pvc
