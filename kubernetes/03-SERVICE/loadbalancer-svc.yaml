# ─────────────────────────────────────────────────────────────────────────────
# WHAT IS A LOADBALANCER SERVICE?
#   LoadBalancer provisions a cloud load balancer (AWS NLB/ELB) and assigns
#   it a public DNS name. Traffic flows: Internet → LB → Pods.
#   Each LoadBalancer service creates its own cloud LB (costs money per service).
#
# USE CASE:
#   Expose color-app directly to the internet on EKS with one command.
#   Good for a single service. For multiple services, use Ingress instead
#   (one ALB for all services).
#
# HOW TO DEMO:
#   kubectl apply -f loadbalancer-svc.yaml -n color-app
#
#   # Watch until EXTERNAL-IP is assigned (takes ~1 min on EKS):
#   kubectl get svc color-app-lb-svc -n color-app -w
#
#   # Once EXTERNAL-IP appears, open it in your browser:
#   http://<EXTERNAL-IP>
#
#   # Or curl it:
#   curl http://<EXTERNAL-IP>/health
#
# USEFUL COMMANDS:
#   kubectl get svc color-app-lb-svc -n color-app
#   kubectl describe svc color-app-lb-svc -n color-app
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Pod
metadata:
  name: color-app-lb-pod
  namespace: color-app
  labels:
    app: color-app
spec:
  containers:
  - name: color-app
    image: chafah/color-app:latest
    ports:
    - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: color-app-lb-svc
  namespace: color-app
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "external"
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
spec:
  selector:
    app: color-app
  type: LoadBalancer
  ports:
  - name: http
    port: 80
    targetPort: 8080
