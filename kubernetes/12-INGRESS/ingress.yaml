# ─────────────────────────────────────────────────────────────────────────────
# WHAT IS AN INGRESS?
#   An Ingress is an API object that manages external HTTP/HTTPS access to
#   services inside the cluster. It acts as a smart router — one load balancer
#   can route to many services based on path rules.
#   An Ingress Controller (e.g. AWS Load Balancer Controller) must be running
#   to process Ingress resources.
#
# USE CASE:
#   Expose color-app to the internet via an AWS ALB without a domain name.
#   After applying, the ADDRESS column shows the ALB DNS — paste it in your
#   browser and the app loads immediately. No DNS record needed.
#
# HOW IT WORKS (no domain):
#   Omitting "host:" means the rule matches ALL incoming requests regardless
#   of hostname. The ALB DNS name itself becomes the access URL.
#
# PREREQUISITES:
#   - AWS Load Balancer Controller installed (done by Terraform helm.tf)
#   - Subnets tagged with kubernetes.io/role/elb=1 (done by Terraform)
#   - color-app-clusterip-svc must exist in the color-app namespace
#
# USEFUL COMMANDS:
#   kubectl apply -f ingress.yaml -n color-app
#   kubectl get ingress -n color-app
#   kubectl describe ingress color-app-ingress -n color-app
#   # Copy the ADDRESS value and open it in your browser
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: color-app-ingress
  namespace: color-app
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: color-app-clusterip-svc
            port:
              number: 80
