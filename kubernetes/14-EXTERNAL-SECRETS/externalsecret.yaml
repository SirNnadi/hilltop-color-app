# ExternalSecret — lists only KEY NAMES, values are pulled from AWS Secrets Manager
# The actual secret values are NEVER stored in this file or in Git
# ESO creates a native Kubernetes Secret called color-app-secret
# refreshInterval: how often ESO checks AWS for updated values
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: color-app-external-secret
  namespace: color-app
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: color-app-secret        # name of the K8s Secret ESO will create
    creationPolicy: Owner
  data:
  - secretKey: SECRET_KEY         # key name in the K8s Secret
    remoteRef:
      key: color-app/prod         # secret name in AWS Secrets Manager
      property: SECRET_KEY        # JSON key inside the secret
  - secretKey: DB_PASSWORD
    remoteRef:
      key: color-app/prod
      property: DB_PASSWORD
  - secretKey: API_KEY
    remoteRef:
      key: color-app/prod
      property: API_KEY
