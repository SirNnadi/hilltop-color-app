# Pod that consumes the secret created by ExternalSecret
# The secret values come from AWS Secrets Manager via ESO
# Only key names are referenced here — values are never in this file
apiVersion: v1
kind: Pod
metadata:
  name: color-app-eso-pod
  namespace: color-app
  labels:
    app: color-app
spec:
  serviceAccountName: eso-sa
  containers:
  - name: color-app
    image: 075120018043.dkr.ecr.us-east-1.amazonaws.com/color-app:v1
    ports:
    - containerPort: 8080
    env:
    - name: SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: color-app-secret    # created by ExternalSecret
          key: SECRET_KEY
    - name: DB_PASSWORD
      valueFrom:
        secretKeyRef:
          name: color-app-secret
          key: DB_PASSWORD
    - name: API_KEY
      valueFrom:
        secretKeyRef:
          name: color-app-secret
          key: API_KEY
