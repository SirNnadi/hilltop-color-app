# ─────────────────────────────────────────────────────────────────────────────
# WHAT IS A DEPLOYMENT?
#   A Deployment manages a ReplicaSet and ensures a desired number of Pod
#   replicas are always running. It handles rolling updates and rollbacks
#   automatically — if you push a bad image, you can roll back with one command.
#
# USE CASE:
#   Run 3 replicas of color-app so the app stays available if a node goes down.
#   When you push a new image tag, the Deployment rolls it out one Pod at a
#   time with zero downtime, then lets you roll back if something breaks.
#
# USEFUL COMMANDS:
#   kubectl apply -f deploy.yaml -n color-app
#   kubectl get deployments -n color-app
#   kubectl rollout status deployment/color-app-deployment -n color-app
#   kubectl rollout history deployment/color-app-deployment -n color-app
#   kubectl rollout undo deployment/color-app-deployment -n color-app
#   kubectl scale deployment color-app-deployment --replicas=5 -n color-app
#   kubectl set image deployment/color-app-deployment color-app=chafah/color-app:v2.0 -n color-app
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: color-app-deployment
  namespace: color-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: color-app
  template:
    metadata:
      labels:
        app: color-app
      annotations:
        kubernetes.io/change-cause: "Initial deployment with color-app:v1"
    spec:
      serviceAccountName: color-app-sa
      containers:
      - name: color-app
        image: chafah/color-app:latest
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: color-app-config
        env:
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: color-app-secret
              key: SECRET_KEY
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
